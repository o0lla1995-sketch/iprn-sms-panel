<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<style>
@page { size: 720px 1020px; margin: 0; }
html, body { margin: 0; padding: 0; width: 720px; background: #f5f8fc; font-family: sans-serif; }
.cover { width: 720px; height: 1016px; background: #0a1628; color: #e8f0f8; break-after: page; }
.cover h1 { padding-top: 300px; text-align: center; }
.main-content {
  padding: 56px 60px 44px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.card { break-inside: avoid; background: #e4ecf5; border: 1px solid #c0d0e2; padding: 14px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="cover"><h1>COVER</h1></div>
<div class="main-content">
<h2>START</h2>
<script>document.write(Array.from({length:40},(_,i)=>'<div class="card">CARD '+(i+1)+' — padding test block with some text to occupy vertical space. هذه بطاقة اختبار.</div>').join(''))</script>
</div>
</body>
</html>
